name: desktop-matrix

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  test-and-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle: app
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo test --all-targets
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Build unsigned desktop package
        run: npx tauri build --config src-tauri/tauri.conf.json --bundles ${{ matrix.bundle }} --ci --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: redtrace-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
