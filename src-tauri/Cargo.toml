[package]
name = "redtrace-desktop"
version = "0.2.0"
edition = "2024"
description = "RED//TRACE desktop shell"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redtrace = { path = ".." }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Pipes"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
